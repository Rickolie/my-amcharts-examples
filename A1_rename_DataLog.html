<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Rename dataLog. Add correct names to csv file</title>
  <link rel="icon" href="data:,"> <!-- Prevent favicon 404 -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script> <!-- Load Pyodide -->
</head>
<body>
  <h2>CSV Correction Tool 2</h2>
  <input type="file" id="originalFile" accept=".csv" />
  <br /><br />
  <button id="runBtn">Run Correction</button>
  <br /><br />
  <a id="downloadLink" style="display:none;">Download Corrected CSV</a>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      console.log("🌐 DOM fully loaded");

      const pyodide = await loadPyodide({
        indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/",
      });
      console.log("✅ Pyodide loaded");

      await pyodide.loadPackage(['pandas']);
      console.log("✅ Pandas loaded");

      const pythonScriptUrl = "https://rickolie.github.io/python/A1_rename_DataLog.py";
      console.log("📡 Fetching Python script from:", pythonScriptUrl);

      const response = await fetch(pythonScriptUrl);
      if (!response.ok) {
        throw new Error(`Failed to fetch Python script: ${response.statusText}`);
      }

      const pythonCode = await response.text();
      console.log("✅ Python script fetched");

      pyodide.FS.mkdirTree("/content");
      pyodide.FS.writeFile("/content/A1_rename_DataLog.py", pythonCode);
      console.log("✅ Python script written to /content");

      async function runPythonScript(originalCsvText) {
        console.log("📁 Writing uploaded CSV to /content/original.csv");
        pyodide.FS.writeFile("/content/original.csv", originalCsvText);

        try {
          console.log("🚀 Running Python script");
          await pyodide.runPythonAsync(`
import pandas as pd
csv_dataLog = '/content/original.csv'
df_dataLog = pd.read_csv(csv_dataLog)
df_dataLog['datetime'] = pd.to_datetime(df_dataLog['Date'].astype(str) + ' ' + df_dataLog['UTC Time'].astype(str), errors='coerce')
df_dataLog.dropna(subset=['datetime'], inplace=True)
df_dataLog = df_dataLog.drop(columns=['Date', 'UTC Time'])
cols = df_dataLog.columns.tolist()
datetime_index = cols.index('datetime')
cols.insert(0, cols.pop(datetime_index))
df_dataLog = df_dataLog[cols]
df_dataLog.to_csv('/content/corrected.csv', index=False)
print("✅ Python script executed successfully")
          `);
        } catch (err) {
          console.error("❌ Python execution error:", err);
          throw err;
        }

        console.log("📤 Reading corrected CSV from /content/corrected.csv");
        return pyodide.FS.readFile("/content/corrected.csv", { encoding: "utf8" });
      }

      document.getElementById("runBtn").onclick = async () => {
        console.log("🟢 Run Correction button clicked");

        const fileInput = document.getElementById("originalFile");
        if (!fileInput.files.length) {
          alert("Please upload the original CSV file.");
          console.log("⚠️ No file uploaded");
          return;
        }

        const text = await fileInput.files[0].text();
        console.log("📄 CSV file loaded");

        document.getElementById("runBtn").disabled = true;
        document.getElementById("runBtn").textContent = "Processing...";

        try {
          const correctedCsv = await runPythonScript(text);
          console.log("✅ Python script finished");

          const blob = new Blob([correctedCsv], { type: "text/csv" });
          const url = URL.createObjectURL(blob);
          const link = document.getElementById("downloadLink");
          link.href = url;
          link.download = "corrected.csv";
          link.style.display = "inline";
          link.textContent = "Download Corrected CSV";
          console.log("📎 Download link ready");
        } catch (err) {
          console.error("❌ Error during processing:", err);
          alert("Error during processing: " + err);
        } finally {
          document.getElementById("runBtn").disabled = false;
          document.getElementById("runBtn").textContent = "Run Correction";
        }
      };
    });
  </script>
</body>
</html>
