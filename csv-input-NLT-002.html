<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <meta charset="UTF-8" />
  <title>CSV Example V1</title>
  <style>
    #chartdiv {
      width: 100%;
      height: 500px;
    }
  </style>
</head>
<body>
  <div id="chartdiv"></div>

  <script>
  am5.ready(function() {
    var root = am5.Root.new("chartdiv");
    root.setThemes([ am5themes_Animated.new(root) ]);

    var chart = root.container.children.push(am5xy.XYChart.new(root, {
      panX: true,
      panY: true,
      wheelX: "panX",
      wheelY: "zoomX"
    }));

    var xAxis = chart.xAxes.push(am5xy.DateAxis.new(root, {
      maxDeviation: 0.2,
      groupData: false,
      baseInterval: { timeUnit: "millisecond", count: 1 },
      renderer: am5xy.AxisRendererX.new(root, {}),
      tooltip: am5.Tooltip.new(root, {})
    }));

    var yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
      renderer: am5xy.AxisRendererY.new(root, {})
    }));

    // Add legend
    var legend = chart.children.push(am5.Legend.new(root, {
      centerX: am5.p50,
      x: am5.p50,
      // Position the legend below the chart
      y: am5.p100,
      centerY: am5.p100
    }));

    // Load CSV
    Papa.parse("csv/dataLog_CorrectedDatetime.csv", {
      download: true,
      header: true,
      dynamicTyping: true,
      complete: function(results) {
        let parsed = results.data
          .filter(row => row.datetime) // remove empty rows
          .map(row => {
            return {
              ...row,
              datetime: new Date(row.datetime).getTime()
            };
          });

        if (parsed.length === 0) {
          console.error("No valid rows found in CSV (datetime parsing failed). Check CSV path/format.");
          return;
        }

        // Sort data by datetime
        parsed.sort(function(a, b) {
          return a.datetime - b.datetime;
        });

        // Get all columns except 'datetime'
        let valueFields = Object.keys(parsed[0]).filter(key => key !== 'datetime');

        // Create a series for each value field
        let seriesList = [];
        valueFields.forEach(function(field) {
          let series = chart.series.push(am5xy.LineSeries.new(root, {
            name: field,
            xAxis: xAxis,
            yAxis: yAxis,
            valueYField: field,
            valueXField: "datetime",
            tooltip: am5.Tooltip.new(root, {}), // Tooltip will show {name}: {valueY} by default
            // Hide series by default
            visible: false
          }));
          seriesList.push(series);
          series.data.setAll(parsed);
        });

        // Set data for the legend and enable checkboxes
        legend.data.setAll(seriesList);
        legend.set("clickTarget", "none"); // Disable clicking on legend items

      }
    });

    chart.appear(1000, 100);
  });
  </script>
</body>
</html>
